<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DICE DUEL</title><link rel="stylesheet" href="final.css?v=1"></head><body><div class="site">
<section id="home" class="view exact-page"><img class="exact-art" src="assets/lobby-exact.png" alt=""><div class="home-overlay"></div><div class="home-mode-switch"><button class="mode active" data-mode="2">⚔ 1 VS 1</button><button class="mode" data-mode="10">♟ BIS ZU 10 SPIELER</button></div><div class="home-card home-create"><h2>RAUM ERSTELLEN</h2><label>Dein Name</label><input id="createName" maxlength="18" placeholder="z. B. Alex"><label>Startzahl</label><input id="start" type="number" min="2" max="1000000000" value="100"><button id="create">RAUM ERSTELLEN</button></div><div class="home-card home-join"><h2>RAUM BEITRETEN</h2><label>Dein Name</label><input id="joinName" maxlength="18" placeholder="z. B. Tom"><label>Raum-Code</label><input id="code" maxlength="6" placeholder="A7K9XX"><button id="join">RAUM BEITRETEN</button></div><p id="configHint" class="configHint"></p></section>
<section id="lobby" class="view exact-page hidden"><img class="exact-art" src="assets/lobby-exact.png" alt=""><button class="hotspot mode mode1" data-mode="2"></button><button class="hotspot mode mode10" data-mode="10"></button><div class="erase mode-value-bg"></div><div id="lobbyModeLabel" class="live mode-value">1 VS 1</div><div class="erase stake-bg"></div><div class="coin-stack big-coins"><i></i><i></i><i></i></div><input id="stakeAmount" class="live stake-value" type="number" min="0" step="1" value="0"><button id="saveStake" class="hotspot saveStake"></button><span id="stakeHint" class="sr"></span><div class="erase roomcode-bg"></div><div id="lobbyCode" class="live roomcode-value">------</div><button id="copyCode" class="hotspot copyCode"></button><button id="copyLink" class="hotspot copyLink"></button><div class="erase player-title-bg"></div><div id="playerCountTitle" class="live player-title">SPIELER</div><button id="shufflePlayers" class="hotspot shuffle hidden"></button><div class="erase player-list-bg"></div><div id="lobbyPlayers" class="live lobbyPlayers"></div><button id="startGame" class="hotspot startGame hidden"></button><p id="wait" class="sr">Warte auf Mitspieler…</p><div class="erase profile-name-bg"></div><div id="profileName" class="live profile-name">SPIELER</div><div class="erase info-values-bg"></div><div id="sideRoomCode" class="live info-value info-room">—</div><div id="sideMode" class="live info-value info-mode">—</div><div id="sideStake" class="live info-value info-stake">0</div><div class="live mini-coin-fixed"><span class="coin-stack mini"><i></i><i></i><i></i></span></div><div id="sideStatus" class="live info-value info-status">Lobby</div><div id="sidePlayers" class="live info-value info-players">—</div></section>
<section id="game" class="view game-page hidden"><div class="game-header"></div><div class="game-shell"><div class="bar">DICE DUEL <small id="gameModeLabel"></small><span>RAUM <strong id="gameCode">------</strong></span></div><div id="players" class="players"></div><div class="game-tools"><button id="shuffleBeforeRoll" class="fantasy-button hidden">🔀 REIHENFOLGE MISCHEN</button><button id="leave" class="fantasy-button">VERLASSEN</button></div><div class="game-columns"><article class="parchment game-main"><h3>AKTUELLE ZAHL</h3><div id="number" class="number">—</div><div id="modeText"></div><div id="stakeText"></div><div id="turnText"></div><button id="roll" class="roll" disabled>🎲 WÜRFELN</button><div id="rollResult"></div></article><article class="parchment"><h3>SPIELHISTORIE</h3><div id="history" class="history"></div></article></div></div></section>
<section id="result" class="view result-page hidden"><div class="game-header"></div><div id="resultCard" class="resultCard"><div id="emoji" class="resultEmoji">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p><div id="resultSummary"></div><button id="rematch" class="fantasy-button wide">🔄 NEUES SPIEL</button><button id="homeBtn" class="fantasy-button wide">HAUPTMENÜ</button></div></section><div id="toast" class="toast"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=final1"></script></body></html>
